<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 8.2  Susunan hak akses dan penulisan angkanya</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <text x="40" y="96" font-size="13" fill="#374151">Tiga kelompok wewenang, tiap kelompok memiliki tiga jenis, masing-masing bernilai tertentu.</text>

  <g font-size="12" fill="#111827" text-anchor="middle">
    <rect x="60" y="120" width="120" height="36" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="120" y="144">Kelompok</text>
    <rect x="180" y="120" width="120" height="36" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="240" y="144">Baca</text>
    <rect x="300" y="120" width="120" height="36" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="360" y="144">Tulis</text>
    <rect x="420" y="120" width="120" height="36" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="480" y="144">Jalankan</text>
    <rect x="540" y="120" width="120" height="36" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="600" y="144">Nilainya</text>

    <rect x="60" y="156" width="120" height="46" fill="#dbeafe" stroke="#2563eb"/>
    <text x="120" y="185">Pemilik</text>
    <rect x="180" y="156" width="120" height="46" fill="#ffffff" stroke="#9ca3af"/>
    <text x="240" y="185">ada, 4</text>
    <rect x="300" y="156" width="120" height="46" fill="#ffffff" stroke="#9ca3af"/>
    <text x="360" y="185">ada, 2</text>
    <rect x="420" y="156" width="120" height="46" fill="#ffffff" stroke="#9ca3af"/>
    <text x="480" y="185">ada, 1</text>
    <rect x="540" y="156" width="120" height="46" fill="#fef3c7" stroke="#b45309"/>
    <text x="600" y="185">7</text>

    <rect x="60" y="202" width="120" height="46" fill="#dcfce7" stroke="#16a34a"/>
    <text x="120" y="231">Grup</text>
    <rect x="180" y="202" width="120" height="46" fill="#ffffff" stroke="#9ca3af"/>
    <text x="240" y="231">ada, 4</text>
    <rect x="300" y="202" width="120" height="46" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="360" y="231">tidak, 0</text>
    <rect x="420" y="202" width="120" height="46" fill="#ffffff" stroke="#9ca3af"/>
    <text x="480" y="231">ada, 1</text>
    <rect x="540" y="202" width="120" height="46" fill="#fef3c7" stroke="#b45309"/>
    <text x="600" y="231">5</text>

    <rect x="60" y="248" width="120" height="46" fill="#fee2e2" stroke="#dc2626"/>
    <text x="120" y="277">Lainnya</text>
    <rect x="180" y="248" width="120" height="46" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="240" y="277">tidak, 0</text>
    <rect x="300" y="248" width="120" height="46" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="360" y="277">tidak, 0</text>
    <rect x="420" y="248" width="120" height="46" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="480" y="277">tidak, 0</text>
    <rect x="540" y="248" width="120" height="46" fill="#fef3c7" stroke="#b45309"/>
    <text x="600" y="277">0</text>
  </g>

  <rect x="700" y="120" width="220" height="174" fill="#f9fafb" stroke="#6b7280"/>
  <g font-size="12" fill="#111827">
    <text x="716" y="146">Nilai tiap jenis:</text>
    <text x="716" y="176">baca       4</text>
    <text x="716" y="202">tulis      2</text>
    <text x="716" y="228">jalankan   1</text>
    <text x="716" y="266" font-weight="bold" fill="#b45309">Hasilnya: 750</text>
  </g>

  <text x="40" y="336" font-size="14" font-weight="bold" fill="#1e3a8a">Angka yang lazim digunakan</text>

  <g font-size="12" fill="#111827">
    <rect x="60" y="356" width="120" height="40" fill="#ffffff" stroke="#9ca3af"/>
    <text x="76" y="381">755</text>
    <rect x="180" y="356" width="420" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="196" y="381">Program yang digunakan bersama</text>

    <rect x="60" y="400" width="120" height="40" fill="#ffffff" stroke="#9ca3af"/>
    <text x="76" y="425">750</text>
    <rect x="180" y="400" width="420" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="196" y="425">Data satu tim, pengguna lain tidak dapat membaca</text>

    <rect x="60" y="444" width="120" height="40" fill="#ffffff" stroke="#9ca3af"/>
    <text x="76" y="469">700</text>
    <rect x="180" y="444" width="420" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="196" y="469">Kunci dan berkas rahasia pribadi</text>

    <rect x="60" y="488" width="120" height="40" fill="#ffffff" stroke="#9ca3af"/>
    <text x="76" y="513">644</text>
    <rect x="180" y="488" width="420" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="196" y="513">Berkas pengaturan biasa</text>
  </g>

  <g font-size="11" fill="#374151">
    <text x="620" y="380">Perintahnya:</text>
    <text x="620" y="402">chmod 750 nama</text>
    <text x="620" y="424">chown pemilik:grup nama</text>
    <text x="620" y="456">Uji dari dua sudut:</text>
    <text x="620" y="476">sebagai anggota grup,</text>
    <text x="620" y="496">dan sebagai pengguna lain.</text>
  </g>
</svg>
