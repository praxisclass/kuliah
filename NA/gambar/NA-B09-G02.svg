<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 9.2  Empat tahap pemberian alamat dan agen penerus</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <rect x="60" y="120" width="180" height="70" fill="#dbeafe" stroke="#2563eb"/>
  <text x="150" y="152" font-size="13" fill="#111827" text-anchor="middle">Perangkat</text>
  <text x="150" y="172" font-size="11" fill="#1e3a8a" text-anchor="middle">belum beralamat</text>

  <rect x="400" y="120" width="200" height="70" fill="#fef3c7" stroke="#b45309"/>
  <text x="500" y="152" font-size="13" fill="#111827" text-anchor="middle">Peladen alamat</text>
  <text x="500" y="172" font-size="11" fill="#92400e" text-anchor="middle">memiliki kolam</text>

  <g font-size="12" fill="#111827">
    <text x="120" y="230">1. cari</text>
    <text x="120" y="252" font-size="11" fill="#374151">siapa dapat memberi alamat</text>
    <text x="440" y="230">2. tawar</text>
    <text x="440" y="252" font-size="11" fill="#374151">satu alamat ditawarkan</text>
    <text x="120" y="310">3. minta</text>
    <text x="120" y="332" font-size="11" fill="#374151">perangkat menyatakan menerima</text>
    <text x="440" y="310">4. sahkan</text>
    <text x="440" y="332" font-size="11" fill="#374151">peladen mengesahkan dan mencatat</text>
  </g>

  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#p)">
    <line x1="240" y1="215" x2="400" y2="215"/>
    <line x1="400" y1="245" x2="240" y2="245"/>
    <line x1="240" y1="295" x2="400" y2="295"/>
    <line x1="400" y1="325" x2="240" y2="325"/>
  </g>
  <defs>
    <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="480" y1="360" x2="480" y2="540" stroke="#d1d5db"/>

  <text x="40" y="386" font-size="13" font-weight="bold" fill="#1e3a8a">Satu segmen</text>
  <text x="540" y="386" font-size="13" font-weight="bold" fill="#7c2d12">Lebih dari satu segmen</text>

  <g font-size="11" fill="#374151">
    <text x="40" y="410">Permintaan dikirim sebagai siaran,</text>
    <text x="40" y="428">dan peladen berada pada segmen yang sama,</text>
    <text x="40" y="446">sehingga ia menerimanya langsung.</text>
    <text x="40" y="472">Tidak diperlukan perangkat tambahan.</text>
    <text x="40" y="496">Bila peladen tidak ada pada segmen itu,</text>
    <text x="40" y="514">permintaannya tidak pernah sampai.</text>
  </g>

  <rect x="540" y="400" width="100" height="50" fill="#dbeafe" stroke="#2563eb"/>
  <text x="590" y="431" font-size="11" fill="#111827" text-anchor="middle">Segmen A</text>

  <rect x="700" y="400" width="110" height="50" fill="#fee2e2" stroke="#dc2626"/>
  <text x="755" y="431" font-size="11" fill="#111827" text-anchor="middle">Agen penerus</text>

  <rect x="860" y="400" width="80" height="50" fill="#fef3c7" stroke="#b45309"/>
  <text x="900" y="431" font-size="11" fill="#111827" text-anchor="middle">Peladen</text>

  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#p)">
    <line x1="640" y1="425" x2="700" y2="425"/>
    <line x1="810" y1="425" x2="860" y2="425"/>
  </g>

  <g font-size="11" fill="#374151">
    <text x="540" y="480">Permintaan siaran tidak menyeberang segmen,</text>
    <text x="540" y="498">karena itu agen penerus meneruskannya</text>
    <text x="540" y="516">ke peladen, lalu mengembalikan jawabannya.</text>
  </g>
</svg>
