    <rect x="170" y="248" width="180" height="34" fill="#fee2e2" stroke="#dc2626"/>
    <text x="182" y="270">0.0.0.0/0</text>
    <rect x="350" y="248" width="150" height="34" fill="#fee2e2" stroke="#dc2626"/>
