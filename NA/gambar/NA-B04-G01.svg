    <rect x="350" y="112" width="150" height="34" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="362" y="134">Kirim ke</text>
    <rect x="500" y="112" width="150" height="34" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="512" y="134">Antarmuka</text>

    <rect x="40" y="146" width="130" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <text x="52" y="168">C</text>
    <rect x="170" y="146" width="180" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <text x="182" y="168">192.168.10.0/26</text>
    <rect x="350" y="146" width="150" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <text x="362" y="168">langsung</text>
    <rect x="500" y="146" width="150" height="34" fill="#ffffff" stroke="#9ca3af"/>
