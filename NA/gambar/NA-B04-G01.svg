  <rect width="960" height="520" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 4.1  Tabel routing dan aturan pencocokan awalan terpanjang</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1e3a8a">Tabel routing pada R1</text>

  <g font-size="12" fill="#111827">
