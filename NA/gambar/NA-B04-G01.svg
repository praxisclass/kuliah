    <rect x="40" y="180" width="130" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <text x="52" y="202">C</text>
    <rect x="170" y="180" width="180" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <text x="182" y="202">192.168.10.64/27</text>
    <rect x="350" y="180" width="150" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <text x="362" y="202">langsung</text>
    <rect x="500" y="180" width="150" height="34" fill="#ffffff" stroke="#9ca3af"/>
    <text x="512" y="202">Gi0/0.20</text>

    <rect x="40" y="214" width="130" height="34" fill="#dcfce7" stroke="#16a34a"/>
