  <text x="40" y="322" font-size="14" font-weight="bold" fill="#1e3a8a">Tiga paket datang, ke mana masing-masing dikirim?</text>

  <g font-size="12" fill="#111827">
    <rect x="40" y="338" width="290" height="60" fill="#f9fafb" stroke="#6b7280"/>
    <text x="52" y="360">Tujuan 192.168.10.20</text>
    <text x="52" y="382" fill="#1e3a8a">Cocok /26 pada baris pertama</text>

    <rect x="350" y="338" width="290" height="60" fill="#f9fafb" stroke="#6b7280"/>
    <text x="362" y="360">Tujuan 192.168.20.5</text>
    <text x="362" y="382" fill="#14532d">Cocok /24 pada baris ketiga</text>

    <rect x="660" y="338" width="290" height="60" fill="#f9fafb" stroke="#6b7280"/>
    <text x="672" y="360">Tujuan 8.8.8.8</text>
    <text x="672" y="382" fill="#991b1b">Tidak cocok, masuk rute bawaan</text>
  </g>

  <g font-size="12" fill="#374151">
    <text x="40" y="436">Baris hijau digunakan bila tujuannya 192.168.20.x, sebab /24 lebih spesifik daripada /0.</text>
    <text x="40" y="458">Baris merah digunakan hanya bila tidak ada baris lain yang cocok.</text>
    <text x="40" y="480">Bila dua baris sama-sama cocok, yang awalannya lebih panjang menang, bukan yang lebih dulu ditulis.</text>
  </g>
