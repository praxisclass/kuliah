<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 4.2  Dua cara menghubungkan antar segmen</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <text x="60" y="98" font-size="14" font-weight="bold" fill="#1e3a8a">Kiri: router dengan subantarmuka</text>
  <text x="540" y="98" font-size="14" font-weight="bold" fill="#7c2d12">Kanan: switch lapis tiga</text>

  <rect x="60" y="120" width="80" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <text x="100" y="145" font-size="12" fill="#111827" text-anchor="middle">Switch</text>

  <rect x="240" y="120" width="160" height="40" fill="#fef3c7" stroke="#b45309"/>
  <text x="320" y="145" font-size="12" fill="#111827" text-anchor="middle">Router</text>

  <line x1="140" y1="140" x2="240" y2="140" stroke="#374151" stroke-width="4"/>
  <text x="190" y="130" font-size="10" fill="#374151" text-anchor="middle">trunk</text>

  <g font-size="11" fill="#374151">
    <text x="60" y="196">VLAN 10, 192.168.10.0/26</text>
    <text x="60" y="238">VLAN 20, 192.168.10.64/27</text>
    <text x="60" y="280">VLAN 30, 192.168.10.96/28</text>
  </g>

  <g font-size="11" fill="#111827">
    <rect x="240" y="182" width="160" height="26" fill="#ffffff" stroke="#9ca3af"/>
    <text x="250" y="200">Gi0/0.10 · 192.168.10.1</text>
    <rect x="240" y="224" width="160" height="26" fill="#ffffff" stroke="#9ca3af"/>
    <text x="250" y="242">Gi0/0.20 · 192.168.10.65</text>
    <rect x="240" y="266" width="160" height="26" fill="#ffffff" stroke="#9ca3af"/>
    <text x="250" y="284">Gi0/0.30 · 192.168.10.97</text>
  </g>

  <g font-size="11" fill="#374151">
    <text x="60" y="330">Satu port fisik dipecah menjadi tiga subantarmuka.</text>
    <text x="60" y="350">Tiap subantarmuka memakai penandaan dot1Q</text>
    <text x="60" y="370">yang nomornya sama dengan VLAN di switch.</text>
  </g>

  <rect x="540" y="120" width="340" height="200" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="560" y="148" font-size="12" font-weight="bold" fill="#111827">Switch lapis tiga, ip routing aktif</text>

  <g font-size="11" fill="#111827">
    <rect x="560" y="164" width="300" height="30" fill="#ffffff" stroke="#9ca3af"/>
    <text x="572" y="184">Antarmuka VLAN 10 · 192.168.10.1/26</text>
    <rect x="560" y="200" width="300" height="30" fill="#ffffff" stroke="#9ca3af"/>
    <text x="572" y="220">Antarmuka VLAN 20 · 192.168.10.65/27</text>
    <rect x="560" y="236" width="300" height="30" fill="#ffffff" stroke="#9ca3af"/>
    <text x="572" y="256">Antarmuka VLAN 30 · 192.168.10.97/28</text>
    <rect x="560" y="272" width="300" height="34" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="572" y="294">Ketiga segmen terhubung di dalam switch</text>
  </g>

  <g font-size="11" fill="#374151">
    <text x="540" y="348">Lalu lintas antar segmen tidak keluar dari switch,</text>
    <text x="540" y="366">sehingga kapasitasnya jauh lebih besar.</text>
    <text x="540" y="392">Perintah ip routing wajib ada. Tanpa itu,</text>
    <text x="540" y="410">ketiga antarmuka maya tidak meneruskan apa pun.</text>
  </g>

  <line x1="480" y1="110" x2="480" y2="440" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6 5"/>

  <g font-size="12" fill="#111827">
    <text x="40" y="470">Pilihan kiri: cocok untuk jaringan kecil, murah, mudah dipahami.</text>
    <text x="40" y="494">Pilihan kanan: cocok bila lalu lintas antar segmen besar, sebab kapasitas penghubungnya jauh lebih tinggi.</text>
    <text x="40" y="518">Keduanya sah, dan keduanya menuntut nomor VLAN yang sama dengan yang ditetapkan pada switch.</text>
  </g>
</svg>
