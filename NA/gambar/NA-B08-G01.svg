<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 8.1  Skema partisi server dan pohon direktori</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1e3a8a">Cakram 100 GB, dibagi menurut kegunaannya</text>

  <g font-size="12" fill="#111827">
    <rect x="60" y="118" width="240" height="60" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="146">/   sistem operasi</text>
    <text x="76" y="166" font-size="11" fill="#1e3a8a">30 GB</text>

    <rect x="60" y="182" width="240" height="50" fill="#dcfce7" stroke="#16a34a"/>
    <text x="76" y="212">/home   30 GB</text>

    <rect x="60" y="236" width="240" height="50" fill="#fef3c7" stroke="#b45309"/>
    <text x="76" y="266">/var   25 GB</text>

    <rect x="60" y="290" width="240" height="40" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="76" y="316">swap   8 GB</text>

    <rect x="60" y="334" width="240" height="44" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/>
    <text x="76" y="356">belum dibagi   7 GB</text>
  </g>

  <g font-size="11" fill="#374151">
    <text x="320" y="146">Sistem tetap dapat berjalan walau /home penuh.</text>
    <text x="320" y="212">Berkas pengguna terpisah dari sistem.</text>
    <text x="320" y="266">Catatan yang membludak tidak mematikan sistem.</text>
    <text x="320" y="316">Tampungan memori, bukan tempat penyimpanan.</text>
    <text x="320" y="360">Sengaja disisakan untuk keperluan mendesak.</text>
  </g>

  <text x="40" y="410" font-size="14" font-weight="bold" fill="#1e3a8a">Pohon direktori yang perlu diingat</text>

  <g font-size="12" fill="#111827">
    <rect x="60" y="428" width="120" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="76" y="453">/etc</text>
    <rect x="200" y="428" width="120" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="216" y="453">/var/log</text>
    <rect x="340" y="428" width="120" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="356" y="453">/home</text>
    <rect x="480" y="428" width="120" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="496" y="453">/srv</text>
    <rect x="620" y="428" width="120" height="40" fill="#f9fafb" stroke="#6b7280"/>
    <text x="636" y="453">/boot</text>
  </g>

  <g font-size="11" fill="#374151">
    <text x="60" y="490">pengaturan</text>
    <text x="200" y="490">catatan kejadian</text>
    <text x="340" y="490">berkas pengguna</text>
    <text x="480" y="490">data layanan</text>
    <text x="620" y="490">berkas awal</text>
  </g>

  <g font-size="12" fill="#111827">
    <text x="40" y="530">Pembagian ruang menurut kegunaannya, bukan sama rata, dan selalu disisakan ruang yang belum dibagi.</text>
  </g>
</svg>
