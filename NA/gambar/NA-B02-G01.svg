<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 2.1  Bagian jaringan dan bagian perangkat pada alamat IPv4</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <g font-size="12" fill="#6b7280">
    <text x="140" y="88">bit 1</text>
    <text x="740" y="88" text-anchor="end">bit 32</text>
  </g>

  <g>
    <text x="40" y="130" font-size="16" font-weight="bold" fill="#1e3a8a">/24</text>
    <rect x="140" y="106" width="480" height="44" fill="#dbeafe" stroke="#2563eb"/>
    <text x="380" y="134" font-size="13" fill="#111827" text-anchor="middle">Bagian jaringan</text>
    <rect x="620" y="106" width="160" height="44" fill="#fef3c7" stroke="#b45309"/>
    <text x="700" y="134" font-size="13" fill="#111827" text-anchor="middle">Perangkat</text>
    <text x="820" y="134" font-size="12" fill="#374151">256 alamat, 254 dapat digunakan</text>
  </g>

  <g>
    <text x="40" y="214" font-size="16" font-weight="bold" fill="#1e3a8a">/26</text>
    <rect x="140" y="190" width="520" height="44" fill="#dbeafe" stroke="#2563eb"/>
    <text x="400" y="218" font-size="13" fill="#111827" text-anchor="middle">Bagian jaringan</text>
    <rect x="660" y="190" width="120" height="44" fill="#fef3c7" stroke="#b45309"/>
    <text x="720" y="218" font-size="13" fill="#111827" text-anchor="middle">Perangkat</text>
    <text x="820" y="218" font-size="12" fill="#374151">64 alamat, 62 dapat digunakan</text>
  </g>

  <g>
    <text x="40" y="298" font-size="16" font-weight="bold" fill="#1e3a8a">/30</text>
    <rect x="140" y="274" width="600" height="44" fill="#dbeafe" stroke="#2563eb"/>
    <text x="440" y="302" font-size="13" fill="#111827" text-anchor="middle">Bagian jaringan</text>
    <rect x="740" y="274" width="40" height="44" fill="#fef3c7" stroke="#b45309"/>
    <text x="820" y="302" font-size="12" fill="#374151">4 alamat, 2 dapat digunakan</text>
  </g>

  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4">
    <line x1="140" y1="340" x2="780" y2="340"/>
  </g>

  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="220" y="360">Oktet 1</text>
    <text x="380" y="360">Oktet 2</text>
    <text x="540" y="360">Oktet 3</text>
    <text x="700" y="360">Oktet 4</text>
  </g>

  <g stroke="#9ca3af" stroke-width="1">
    <line x1="300" y1="106" x2="300" y2="150"/>
    <line x1="460" y1="106" x2="460" y2="150"/>
    <line x1="620" y1="106" x2="620" y2="150"/>
    <line x1="300" y1="190" x2="300" y2="234"/>
    <line x1="460" y1="190" x2="460" y2="234"/>
    <line x1="620" y1="190" x2="620" y2="234"/>
    <line x1="300" y1="274" x2="300" y2="318"/>
    <line x1="460" y1="274" x2="460" y2="318"/>
    <line x1="620" y1="274" x2="620" y2="318"/>
  </g>

  <text x="40" y="404" font-size="13" fill="#111827">Makin panjang awalannya, makin banyak bagian jaringan dan makin sedikit alamat untuk perangkat.</text>
  <text x="40" y="424" font-size="13" fill="#111827">Garis pemisah tidak harus jatuh pada batas oktet, seperti tampak pada /26 dan /30.</text>
</svg>
