<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p9" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 9.1  Alur pemeriksaan nama dari pengguna ke peladen otoritatif</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <rect x="50" y="120" width="150" height="70" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="152" font-size="13" fill="#111827" text-anchor="middle">Perangkat</text>
  <text x="125" y="172" font-size="11" fill="#1e3a8a" text-anchor="middle">bertanya nama</text>

  <rect x="300" y="120" width="170" height="70" fill="#dcfce7" stroke="#16a34a"/>
  <text x="385" y="152" font-size="13" fill="#111827" text-anchor="middle">Pemeriksa</text>
  <text x="385" y="172" font-size="11" fill="#14532d" text-anchor="middle">menyimpan sementara</text>

  <rect x="570" y="100" width="150" height="50" fill="#fef3c7" stroke="#b45309"/>
  <text x="645" y="131" font-size="12" fill="#111827" text-anchor="middle">Akar</text>

  <rect x="570" y="170" width="150" height="50" fill="#fef3c7" stroke="#b45309"/>
  <text x="645" y="201" font-size="12" fill="#111827" text-anchor="middle">Nama tingkat atas</text>

  <rect x="780" y="135" width="150" height="60" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="855" y="162" font-size="12" fill="#111827" text-anchor="middle">Otoritatif</text>
  <text x="855" y="182" font-size="11" fill="#4338ca" text-anchor="middle">sumber sahnya</text>

  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#p9)">
    <line x1="200" y1="155" x2="300" y2="155"/>
    <line x1="470" y1="145" x2="570" y2="125"/>
    <line x1="470" y1="165" x2="570" y2="190"/>
    <line x1="720" y1="125" x2="780" y2="155"/>
    <line x1="720" y1="190" x2="780" y2="175"/>
  </g>

  <g font-size="11" fill="#374151">
    <text x="205" y="146">1. tanya</text>
    <text x="478" y="132">2. tanya berurutan</text>
    <text x="725" y="112">3. tanya</text>
  </g>

  <g stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#p9)">
    <path d="M780 200 L620 260 L470 200 L300 200"/>
  </g>
  <text x="400" y="288" font-size="11" fill="#14532d" text-anchor="middle">4. jawaban dikembalikan, lalu disimpan menurut masa berlakunya</text>

  <rect x="50" y="330" width="880" height="80" fill="#f9fafb" stroke="#6b7280"/>
  <g font-size="12" fill="#111827">
    <text x="70" y="356">Uji langsung ke peladen otoritatif:  dig @alamat nama</text>
    <text x="70" y="380">Bila langsung berhasil, zonanya benar, dan persoalannya ada pada pemeriksa atau pada perangkatnya.</text>
    <text x="70" y="400">Bila langsung pun gagal, periksa zona, nomor seri, dan keadaan layanannya.</text>
  </g>

  <g font-size="12" fill="#374151">
    <text x="40" y="450">Pemeriksa menyimpan jawaban sementara, sehingga perubahan zona tidak langsung terasa pada perangkat yang sudah pernah bertanya.</text>
    <text x="40" y="474">Masa berlaku yang terlalu panjang membuat perubahan lambat tersebar; yang terlalu pendek membuat peladen sibuk menjawab pertanyaan sama.</text>
    <text x="40" y="498">Kegagalan dapat terjadi pada perangkat, pada pemeriksa, pada jaringan di antaranya, atau pada peladen otoritatifnya.</text>
  </g>
</svg>
