<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 5.2  Perhitungan cost dan pemilihan jalur</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <g font-size="13" fill="#111827" text-anchor="middle">
    <rect x="90" y="120" width="90" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <text x="135" y="151">A</text>

    <rect x="330" y="90" width="90" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <text x="375" y="121">B</text>

    <rect x="330" y="230" width="90" height="50" fill="#dbeafe" stroke="#2563eb"/>
    <text x="375" y="261">C</text>

    <rect x="600" y="160" width="90" height="50" fill="#fef3c7" stroke="#b45309"/>
    <text x="645" y="191">D</text>
  </g>

  <g stroke="#374151" stroke-width="2">
    <line x1="180" y1="140" x2="330" y2="115"/>
    <line x1="180" y1="152" x2="330" y2="255"/>
    <line x1="420" y1="120" x2="600" y2="170"/>
    <line x1="420" y1="255" x2="600" y2="190"/>
  </g>

  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="255" y="112">FastEthernet</text>
    <text x="255" y="128" fill="#1e3a8a">cost 1</text>
    <text x="255" y="222">FastEthernet</text>
    <text x="255" y="238" fill="#1e3a8a">cost 1</text>
    <text x="510" y="138">sewa 2 Mbps</text>
    <text x="510" y="154" fill="#991b1b">cost 50</text>
    <text x="510" y="238">FastEthernet</text>
    <text x="510" y="254" fill="#1e3a8a">cost 1</text>
  </g>

  <rect x="740" y="90" width="180" height="240" fill="#f9fafb" stroke="#6b7280"/>
  <g font-size="12" fill="#111827">
    <text x="756" y="116">Dua jalur dari A:</text>
    <text x="756" y="152">lewat B</text>
    <text x="756" y="172">1 + 50 = 51</text>
    <text x="756" y="212">lewat C</text>
    <text x="756" y="232">1 + 1 = 2</text>
    <text x="756" y="280" font-weight="bold" fill="#14532d">Dipilih lewat C</text>
    <text x="756" y="304" font-size="11" fill="#374151">walaupun jumlah</text>
    <text x="756" y="320" font-size="11" fill="#374151">lompatannya sama</text>
  </g>

  <line x1="740" y1="356" x2="920" y2="356" stroke="#9ca3af"/>

  <g font-size="12" fill="#111827">
    <text x="40" y="390">OSPF menghitung ongkos, bukan jumlah lompatan.</text>
    <text x="40" y="414">Tautan lambat membuat jalur menjadi mahal, walau tampak lebih pendek pada gambar topologi.</text>
  </g>

  <g font-size="12" fill="#374151">
    <text x="40" y="456">Rumus: cost = nilai acuan dibagi lebar pita antarmuka. Nilai acuan lazimnya 100.000.000.</text>
    <text x="40" y="480">Bila nilai acuannya masih 100 megabit, antarmuka 100 Mbps dan 1.000 Mbps keduanya bernilai 1.</text>
    <text x="40" y="504">Sebagian perangkat memakai nilai acuan berbeda secara bawaan, karena itu periksa sebelum menghitung.</text>
  </g>
</svg>
