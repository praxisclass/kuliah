<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 3.1  Domain siaran sebelum dan sesudah pembagian VLAN</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <text x="60" y="98" font-size="14" font-weight="bold" fill="#991b1b">Sebelum: satu domain siaran</text>
  <text x="560" y="98" font-size="14" font-weight="bold" fill="#14532d">Sesudah: empat domain siaran</text>

  <rect x="60" y="118" width="380" height="300" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="250" y="146" font-size="13" fill="#111827" text-anchor="middle">100 perangkat menerima siaran yang sama</text>

  <g fill="#f9fafb" stroke="#6b7280">
    <rect x="90" y="170" width="26" height="20"/>
    <rect x="130" y="170" width="26" height="20"/>
    <rect x="170" y="170" width="26" height="20"/>
    <rect x="210" y="170" width="26" height="20"/>
    <rect x="250" y="170" width="26" height="20"/>
    <rect x="290" y="170" width="26" height="20"/>
    <rect x="330" y="170" width="26" height="20"/>
    <rect x="370" y="170" width="26" height="20"/>

    <rect x="90" y="210" width="26" height="20"/>
    <rect x="130" y="210" width="26" height="20"/>
    <rect x="170" y="210" width="26" height="20"/>
    <rect x="210" y="210" width="26" height="20"/>
    <rect x="250" y="210" width="26" height="20"/>
    <rect x="290" y="210" width="26" height="20"/>
    <rect x="330" y="210" width="26" height="20"/>
    <rect x="370" y="210" width="26" height="20"/>

    <rect x="90" y="250" width="26" height="20"/>
    <rect x="130" y="250" width="26" height="20"/>
    <rect x="170" y="250" width="26" height="20"/>
    <rect x="210" y="250" width="26" height="20"/>
    <rect x="250" y="250" width="26" height="20"/>
    <rect x="290" y="250" width="26" height="20"/>
    <rect x="330" y="250" width="26" height="20"/>
    <rect x="370" y="250" width="26" height="20"/>

    <rect x="90" y="290" width="26" height="20"/>
    <rect x="130" y="290" width="26" height="20"/>
    <rect x="170" y="290" width="26" height="20"/>
    <rect x="210" y="290" width="26" height="20"/>
  </g>

  <text x="250" y="340" font-size="12" fill="#374151" text-anchor="middle">Setiap siaran diterima oleh 99 perangkat lainnya</text>
  <text x="250" y="362" font-size="12" fill="#374151" text-anchor="middle">19.800 penerimaan siaran per menit</text>
  <text x="250" y="398" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">Satu gangguan dirasakan seluruh perangkat</text>

  <rect x="560" y="118" width="360" height="74" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="580" y="146" font-size="13" font-weight="bold" fill="#111827">VLAN 10 Staf, 40 perangkat</text>
  <text x="580" y="168" font-size="12" fill="#374151">3.120 penerimaan siaran per menit</text>

  <rect x="560" y="204" width="360" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="580" y="232" font-size="13" font-weight="bold" fill="#111827">VLAN 20 Tamu, 25 perangkat</text>
  <text x="580" y="254" font-size="12" fill="#374151">1.200 penerimaan siaran per menit</text>

  <rect x="560" y="290" width="360" height="74" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="580" y="318" font-size="13" font-weight="bold" fill="#111827">VLAN 30 Server, 20 perangkat</text>
  <text x="580" y="340" font-size="12" fill="#374151">760 penerimaan siaran per menit</text>

  <rect x="560" y="376" width="360" height="74" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="580" y="404" font-size="13" font-weight="bold" fill="#111827">VLAN 99 Manajemen, 15 perangkat</text>
  <text x="580" y="426" font-size="12" fill="#374151">420 penerimaan siaran per menit</text>

  <text x="40" y="486" font-size="13" fill="#111827">Jumlah perangkat tetap seratus, tetapi beban siaran turun menjadi 5.500 penerimaan per menit.</text>
  <text x="40" y="510" font-size="13" fill="#111827">Siaran tidak lagi menyeberang antar VLAN, sehingga gangguan pada satu segmen tidak menjalar ke segmen lain.</text>
</svg>
