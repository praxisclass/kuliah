<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="panah" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 1.2  Topologi fisik dan topologi logika instansi tiga lantai</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <text x="40" y="92" font-size="14" font-weight="bold" fill="#1e3a8a">Keadaan fisik: perangkat dan kabelnya</text>
  <text x="540" y="92" font-size="14" font-weight="bold" fill="#7c2d12">Keadaan logika: aliran data dan pembagian jaringan</text>

  <ellipse cx="230" cy="130" rx="70" ry="30" fill="#e5e7eb" stroke="#4b5563"/>
  <text x="230" y="135" font-size="13" fill="#111827" text-anchor="middle">Internet</text>

  <line x1="230" y1="160" x2="230" y2="186" stroke="#374151" stroke-width="2"/>

  <rect x="170" y="186" width="120" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="211" font-size="13" fill="#111827" text-anchor="middle">Router + Firewall</text>

  <line x1="230" y1="226" x2="230" y2="252" stroke="#374151" stroke-width="2"/>

  <rect x="170" y="252" width="120" height="40" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="277" font-size="13" fill="#111827" text-anchor="middle">Switch Inti</text>

  <line x1="215" y1="292" x2="90" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="230" y1="292" x2="230" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="245" y1="292" x2="370" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="230" y1="292" x2="230" y2="386" stroke="#374151" stroke-width="2"/>

  <rect x="45" y="330" width="90" height="38" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="90" y="354" font-size="12" fill="#111827" text-anchor="middle">Switch L1</text>

  <rect x="185" y="330" width="90" height="38" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="230" y="354" font-size="12" fill="#111827" text-anchor="middle">Switch L2</text>

  <rect x="325" y="330" width="90" height="38" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="370" y="354" font-size="12" fill="#111827" text-anchor="middle">Switch L3</text>

  <g font-size="11" fill="#4b5563">
    <text x="45" y="392">20 komputer</text>
    <text x="185" y="392">25 komputer</text>
    <text x="325" y="392">15 komputer</text>
  </g>

  <line x1="230" y1="368" x2="230" y2="386" stroke="#374151" stroke-width="2"/>
  <rect x="170" y="386" width="120" height="38" fill="#fef3c7" stroke="#b45309"/>
  <text x="230" y="410" font-size="12" fill="#111827" text-anchor="middle">2 Server</text>

  <g fill="#9ca3af" stroke="#6b7280">
    <rect x="45" y="440" width="18" height="14"/>
    <rect x="70" y="440" width="18" height="14"/>
    <rect x="95" y="440" width="18" height="14"/>
    <rect x="185" y="440" width="18" height="14"/>
    <rect x="210" y="440" width="18" height="14"/>
    <rect x="255" y="440" width="18" height="14"/>
    <rect x="325" y="440" width="18" height="14"/>
    <rect x="350" y="440" width="18" height="14"/>
  </g>
  <text x="45" y="474" font-size="11" fill="#4b5563">Kotak abu-abu melambangkan komputer pada tiap lantai.</text>

  <rect x="540" y="120" width="380" height="78" rx="8" fill="#ffe4e6" stroke="#be123c"/>
  <text x="560" y="148" font-size="13" font-weight="bold" fill="#111827">Segmen Tamu</text>
  <text x="560" y="170" font-size="12" fill="#374151">Klien nirkabel tamu, tanpa akses ke server</text>

  <rect x="540" y="216" width="380" height="78" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="560" y="244" font-size="13" font-weight="bold" fill="#111827">Segmen Staf</text>
  <text x="560" y="266" font-size="12" fill="#374151">Komputer staf pada tiga lantai</text>

  <rect x="540" y="312" width="380" height="78" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="560" y="340" font-size="13" font-weight="bold" fill="#111827">Segmen Server</text>
  <text x="560" y="362" font-size="12" fill="#374151">Layanan nama, web, surat, berkas</text>

  <rect x="540" y="408" width="380" height="78" rx="8" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="560" y="436" font-size="13" font-weight="bold" fill="#111827">Segmen Manajemen</text>
  <text x="560" y="458" font-size="12" fill="#374151">Perangkat jaringan dikelola pada segmen ini</text>

  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#panah)">
    <path d="M700 198 L700 216"/>
    <path d="M740 294 L740 312"/>
    <path d="M780 390 L780 408"/>
  </g>

  <g font-size="11" fill="#374151">
    <text x="708" y="212">izin terbatas</text>
    <text x="748" y="308">izin staf</text>
    <text x="788" y="404">izin penuh</text>
  </g>

  <text x="540" y="524" font-size="12" fill="#4b5563">Secara fisik ada enam switch, tetapi secara logika ada empat segmen.</text>
  <text x="540" y="544" font-size="12" fill="#4b5563">Kedua gambar diperlukan: yang fisik untuk mencari perangkat,</text>
  <text x="540" y="564" font-size="12" fill="#4b5563">yang logika untuk memahami batas akses.</text>

  <text x="45" y="520" font-size="12" fill="#4b5563">Gambar kiri menjawab: perangkat mana yang harus diperiksa.</text>
  <text x="45" y="540" font-size="12" fill="#4b5563">Gambar kanan menjawab: siapa yang boleh mengakses apa.</text>
</svg>
