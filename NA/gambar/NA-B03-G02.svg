<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="380" fill="#ffffff"/>

  <text x="40" y="38" font-size="18" font-weight="bold" fill="#111827">Gambar 3.2  Bingkai Ethernet bertanda 802.1Q</text>
  <text x="40" y="60" font-size="13" fill="#4b5563">Sumber: diolah untuk buku ini</text>

  <g font-size="12" fill="#111827">
    <rect x="60" y="110" width="150" height="70" fill="#f3f4f6" stroke="#4b5563"/>
    <text x="135" y="145" text-anchor="middle">Alamat tujuan</text>
    <text x="135" y="163" text-anchor="middle" font-size="11" fill="#6b7280">6 byte</text>

    <rect x="210" y="110" width="150" height="70" fill="#f3f4f6" stroke="#4b5563"/>
    <text x="285" y="145" text-anchor="middle">Alamat sumber</text>
    <text x="285" y="163" text-anchor="middle" font-size="11" fill="#6b7280">6 byte</text>

    <rect x="360" y="110" width="110" height="70" fill="#fee2e2" stroke="#dc2626"/>
    <text x="415" y="145" text-anchor="middle">TPID</text>
    <text x="415" y="163" text-anchor="middle" font-size="11" fill="#991b1b">2 byte, 0x8100</text>

    <rect x="470" y="110" width="180" height="70" fill="#fee2e2" stroke="#dc2626"/>
    <text x="560" y="145" text-anchor="middle">PCP, DEI, dan VID</text>
    <text x="560" y="163" text-anchor="middle" font-size="11" fill="#991b1b">2 byte</text>

    <rect x="650" y="110" width="110" height="70" fill="#f3f4f6" stroke="#4b5563"/>
    <text x="705" y="145" text-anchor="middle">Jenis</text>
    <text x="705" y="163" text-anchor="middle" font-size="11" fill="#6b7280">2 byte</text>

    <rect x="760" y="110" width="140" height="70" fill="#fef3c7" stroke="#b45309"/>
    <text x="830" y="145" text-anchor="middle">Data</text>
    <text x="830" y="163" text-anchor="middle" font-size="11" fill="#92400e">46 sampai 1500 byte</text>
  </g>

  <path d="M360 196 L360 214 L650 214 L650 196" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="505" y="234" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Penanda 802.1Q, 4 byte, disisipkan</text>

  <text x="60" y="96" font-size="12" fill="#6b7280">Bingkai tanpa tanda</text>
  <text x="360" y="96" font-size="12" fill="#dc2626">Disisipkan pada bingkai bertanda</text>

  <g font-size="12" fill="#374151">
    <text x="60" y="286">TPID menyatakan bahwa bingkai ini bertanda, sehingga perangkat di ujung lain tahu harus membaca penandanya.</text>
    <text x="60" y="310">VID menyimpan nomor VLAN, 12 bit, sehingga tersedia 4094 nomor yang dapat digunakan.</text>
    <text x="60" y="334">Bingkai tanpa tanda yang tiba pada trunk dianggap sebagai anggota VLAN asli.</text>
    <text x="60" y="358">Karena penanda menambah 4 byte, bingkai bertanda sedikit lebih besar daripada bingkai biasa.</text>
  </g>
</svg>
